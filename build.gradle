plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'org.javadominicano'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'org.javadominicano.cmp.CmpApplication' // Reemplaza Main por CmpApplication
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot y web
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:10.1.20'
    implementation 'org.apache.tomcat.embed:tomcat-embed-websocket:10.1.20'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'mysql:mysql-connector-java:8.0.33'

    // Para generar reportes en Excel
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    // Para generar reportes en PDF
    implementation 'com.github.librepdf:openpdf:1.3.30'

    // Tests
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    implementation 'ch.qos.logback:logback-classic:1.4.14'
}

tasks.named('test') {
    useJUnitPlatform()
}

run {
    standardInput = System.in
}

bootJar {
    archiveFileName = 'prueba-mqtt.jar'
}
