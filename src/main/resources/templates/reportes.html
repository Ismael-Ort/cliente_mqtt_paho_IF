<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Reportes | WeatherNet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/dashboard.css" />
    <style>
        .main-content {
            padding: 2rem;
        }
        .main-content h2 {
            color: #333;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>WeatherNet</h2>
    <ul>
        <li><a href="/dashboard">Dashboard</a></li>
        <li sec:authorize="hasRole('ADMIN')"><a href="/dashboard/administrar-estaciones">Estaciones</a></li>
        <li><a href="/dashboard/reportes" class="active">Reportes</a></li>
        <li><a href="/dashboard/graficos">Gráficos</a></li>
    </ul>
    <hr style="border: none; border-top: 1px solid #334155; margin: 20px 0;">
    <ul>
        <li>
            <form th:action="@{/logout}" method="post">
                <button type="submit" style="background: none; border: none; color: #f87171; font-weight: bold; cursor: pointer;">⏻ Cerrar sesión</button>
            </form>
        </li>
    </ul>
</div>

<div class="main-content">
    <div class="container-fluid">
        <h2>Reportes de Registros</h2>

    <!-- Filtros -->
    <form th:action="@{/dashboard/reportes}" method="get" class="row g-3 mb-4 align-items-end">
        <div class="col-md-4">
            <label for="stationId" class="form-label">Estación</label>
            <select id="stationId" name="stationId" class="form-select">
                <option value="">Todas las estaciones</option>
                <option th:each="est : ${estaciones}"
                        th:value="${est.stationId}"
                        th:text="${est.stationModel}"
                        th:selected="${est.stationId == stationId}">
                </option>
            </select>
        </div>
        <div class="col-md-3">
            <label for="fechaDesde" class="form-label">Desde</label>
            <input type="date" id="fechaDesde" name="fechaDesde" class="form-control" th:value="${fechaDesde != null ? #dates.format(fechaDesde, 'yyyy-MM-dd') : ''}">
        </div>
        <div class="col-md-3">
            <label for="fechaHasta" class="form-label">Hasta</label>
            <input type="date" id="fechaHasta" name="fechaHasta" class="form-control" th:value="${fechaHasta != null ? #dates.format(fechaHasta, 'yyyy-MM-dd') : ''}">
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Filtrar</button>
        </div>
    </form>

    <!-- Botones de Descarga -->
    <div class="mb-3">
        <span>Descargar como:</span>
        <button class="btn btn-danger btn-sm btn-descarga" data-formato="pdf">PDF</button>
        <button class="btn btn-success btn-sm btn-descarga" data-formato="xlsx">Excel</button>
        <button class="btn btn-secondary btn-sm btn-descarga" data-formato="csv">CSV</button>
    </div>

    <!-- Tabla de Registros -->
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Estación</th>
            <th>Sensor</th>
            <th>Tipo</th>
            <th>Valor</th>
            <th>Fecha y Hora</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="reg : ${registros}">
            <td th:text="${reg.nombreEstacion}"></td>
            <td th:text="${reg.modeloSensor}"></td>
            <td th:text="${reg.tipoSensor}"></td>
            <!-- Unimos el valor y la unidad para mayor claridad -->
            <td th:text="${#numbers.formatDecimal(reg.valor, 1, 2)} + ' ' + ${reg.unidad}"></td>
            <td th:text="${#dates.format(reg.fecha, 'yyyy-MM-dd HH:mm:ss')}"></td>
        </tr>
        </tbody>
    </table>

    <!-- Paginación (si la usas) -->
    <nav aria-label="Page navigation" th:if="${totalPages > 1}">
        <ul class="pagination">
            <!-- Botón Anterior -->
            <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/dashboard/reportes(page=${currentPage - 1}, stationId=${stationId}, fechaDesde=${fechaDesde != null ? #dates.format(fechaDesde, 'yyyy-MM-dd') : ''}, fechaHasta=${fechaHasta != null ? #dates.format(fechaHasta, 'yyyy-MM-dd') : ''})}">Anterior</a>
            </li>

            <!-- Primera página -->
            <li class="page-item" th:classappend="${currentPage == 0 ? 'active' : ''}">
                <a class="page-link" th:href="@{/dashboard/reportes(page=0, stationId=${stationId}, fechaDesde=${fechaDesde != null ? #dates.format(fechaDesde, 'yyyy-MM-dd') : ''}, fechaHasta=${fechaHasta != null ? #dates.format(fechaHasta, 'yyyy-MM-dd') : ''})}">1</a>
            </li>

            <!-- Primeros puntos suspensivos -->
            <li class="page-item disabled" th:if="${currentPage > 2}"><span class="page-link">...</span></li>

            <!-- Páginas intermedias (alrededor de la actual) -->
            <th:block th:each="i : ${#numbers.sequence(1, totalPages - 2)}">
                <li class="page-item" th:if="${i >= currentPage - 1 && i <= currentPage + 1}" th:classappend="${i == currentPage ? 'active' : ''}">
                    <a class="page-link" th:href="@{/dashboard/reportes(page=${i}, stationId=${stationId}, fechaDesde=${fechaDesde != null ? #dates.format(fechaDesde, 'yyyy-MM-dd') : ''}, fechaHasta=${fechaHasta != null ? #dates.format(fechaHasta, 'yyyy-MM-dd') : ''})}" th:text="${i + 1}"></a>
                </li>
            </th:block>

            <!-- Últimos puntos suspensivos -->
            <li class="page-item disabled" th:if="${currentPage < totalPages - 3}"><span class="page-link">...</span></li>

            <!-- Última página -->
            <li class="page-item" th:if="${totalPages > 1}" th:classappend="${currentPage == totalPages - 1 ? 'active' : ''}">
                <a class="page-link" th:href="@{/dashboard/reportes(page=${totalPages - 1}, stationId=${stationId}, fechaDesde=${fechaDesde != null ? #dates.format(fechaDesde, 'yyyy-MM-dd') : ''}, fechaHasta=${fechaHasta != null ? #dates.format(fechaHasta, 'yyyy-MM-dd') : ''})}" th:text="${totalPages}"></a>
            </li>

            <!-- Botón Siguiente -->
            <li class="page-item" th:classappend="${currentPage >= totalPages - 1 ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/dashboard/reportes(page=${currentPage + 1}, stationId=${stationId}, fechaDesde=${fechaDesde != null ? #dates.format(fechaDesde, 'yyyy-MM-dd') : ''}, fechaHasta=${fechaHasta != null ? #dates.format(fechaHasta, 'yyyy-MM-dd') : ''})}">Siguiente</a>
            </li>
        </ul>
    </nav>

    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 1. Seleccionar todos los botones de descarga por su clase
        const botonesDescarga = document.querySelectorAll('.btn-descarga');

        // 2. Añadir un evento 'click' a cada botón
        botonesDescarga.forEach(boton => {
            boton.addEventListener('click', function() {
                // 3. Obtener el formato (pdf, xlsx, csv) del atributo 'data-formato'
                const formato = this.getAttribute('data-formato');

                // 4. Obtener los valores actuales de los filtros
                const stationId = document.getElementById('stationId').value;
                const fechaDesde = document.getElementById('fechaDesde').value;
                const fechaHasta = document.getElementById('fechaHasta').value;

                // 5. Construir la URL de descarga con los parámetros
                const params = new URLSearchParams();
                params.append('formato', formato);

                if (stationId) {
                    params.append('stationId', stationId);
                }
                if (fechaDesde) {
                    params.append('fechaDesde', fechaDesde);
                }
                if (fechaHasta) {
                    params.append('fechaHasta', fechaHasta);
                }

                // 6. Redirigir a la URL para iniciar la descarga
                window.location.href = `/api/reportes/descargar?${params.toString()}`;
            });
        });
    });
</script>

</body>
</html>
