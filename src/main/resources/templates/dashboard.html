<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | WeatherNet</title>
    <link rel="stylesheet" href="/css/dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2/dist/stomp.min.js"></script>
</head>
<body>
<div class="sidebar">
    <h2>WeatherNet</h2>
    <ul>
        <li><a href="/dashboard" class="active">Dashboard</a></li>

        <li sec:authorize="hasRole('ADMIN')">
            <a href="/dashboard/administrar-estaciones">Estaciones</a>
        </li>

        <li sec:authorize="hasAnyRole('ADMIN', 'USER')">
            <a href="/dashboard/reportes">Reportes</a>
        </li>

        <li sec:authorize="hasAnyRole('ADMIN', 'USER')">
            <a href="/dashboard/graficos">Gráficos</a>
        </li>
    </ul>

    <hr style="border: none; border-top: 1px solid #334155; margin: 20px 0;">
    <h3>Alertas</h3>
    <div id="alertas-container" class="alertas-content">
        <p>Cargando alertas...</p>
    </div>
    <div id="alertas-pagination" class="pagination"></div>
    <form id="alert-form" class="sidebar-alert-form">
        <select id="alert-station-select"><option value="">Estación...</option></select>
        <select id="alert-sensor-select" disabled><option value="">Sensor...</option></select>
        <input type="number" id="alert-valor" placeholder="Umbral" required />
        <input type="text" id="alert-mensaje" placeholder="Mensaje" required />
        <button type="submit">Crear Alerta</button>
    </form>
    <hr style="border: none; border-top: 1px solid #334155; margin: 20px 0;">

    <ul>
        <li>
            <form th:action="@{/logout}" method="post">
                <button type="submit" style="background: none; border: none; color: #f87171; font-weight: bold; cursor: pointer;">⏻ Cerrar sesión</button>
            </form>
        </li>
    </ul>
</div>

<div class="main-content">
    <h1>Dashboard</h1>

    <div id="resumen-general" class="card-grid small-cards"></div>

    <h2 style="margin-top: 2rem;">Estaciones Meteorológicas</h2>
    <div id="summary" class="cards-container">
        <div th:each="est : ${resumen}"
             th:class="${'station-card' + (est.status == 'DESCONECTADA' ? ' offline' : '')}">
            <h3 th:text="${est.stationName}"></h3>
            <p><strong>Estado:</strong> <span th:text="${est.status}"></span></p>
            <p>
                <strong>Última lectura:</strong><br>
                <span th:text="${est.lastUpdate != null ? #dates.format(est.lastUpdate,'dd/MM/yyyy HH:mm:ss') : 'No disponible'}"></span>
            </p>
            <ul>
                <li>🌡️ Temperatura: <span th:text="${est.data['temperatura']} ?: 'N/D'"></span> °C</li>
                <li>💧 Humedad: <span th:text="${est.data['humedad']} ?: 'N/D'"></span> %</li>
                <li>⬇️ Presión: <span th:text="${est.data['presion']} ?: 'N/D'"></span> hPa</li>
                <li>💨 Viento: <span th:text="${est.data['viento']} ?: 'N/D'"></span> m/s</li>
                <li>🌧️ Precipitación: <span th:text="${est.data['precipitacion']} ?: 'N/D'"></span> mm</li>
                <li>🌱 Humedad Suelo: <span th:text="${est.data['humedad_suelo']} ?: 'N/D'"></span> %</li>
            </ul>
        </div>
    </div>

    <div style="margin: 1rem 0;">
        <button onclick="cargarDashboard()" style="padding: 8px 16px; font-weight: bold;">
            🔄 Actualizar Datos
        </button>
    </div>

</div>

<script>
let alertasData = [];
let paginaActual = 1;
const itemsPorPagina = 5;

function renderEstaciones(estaciones) {
    const container = document.getElementById("summary");
    container.innerHTML = "";
    estaciones.forEach(est => {
        const card = document.createElement("div");
        card.classList.add("station-card");
        if (est.status === "DESCONECTADA") {
            card.classList.add("offline");
        }
        const ultimaLectura = est.lastUpdate ? new Date(est.lastUpdate).toLocaleString() : "No disponible";
        card.innerHTML = `
            <h3>${est.stationName}</h3>
            <p><strong>Estado:</strong> ${est.status}</p>
            <p><strong>Última lectura:</strong><br> ${ultimaLectura}</p>
            <ul>
                <li>🌡️ Temperatura: ${est.data?.temperatura ?? 'N/D'} °C</li>
                <li>💧 Humedad: ${est.data?.humedad ?? 'N/D'} %</li>
                <li>⬇️ Presión: ${est.data?.presion ?? 'N/D'} hPa</li>
                <li>💨 Viento: ${est.data?.viento ?? 'N/D'} m/s</li>
                <li>🌧️ Precipitación: ${est.data?.precipitacion ?? 'N/D'} mm</li>
                <li>🌱 Humedad Suelo: ${est.data?.humedad_suelo ?? 'N/D'} %</li>
            </ul>`;
        container.appendChild(card);
    });
}

function renderAlertasTabla() {
    const alertasDiv = document.getElementById("alertas-container");
    const pagDiv = document.getElementById("alertas-pagination");
    if (alertasData.length === 0) {
        alertasDiv.innerHTML = "<p>✅ No hay alertas activas.</p>";
        pagDiv.innerHTML = "";
        return;
    }
    const totalPaginas = Math.ceil(alertasData.length / itemsPorPagina);
    let html = `
        <table class="alert-table">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Estación</th>
                    <th>Sensor</th>
                    <th>Tipo</th>
                    <th>Valor</th>
                    <th>Mensaje</th>
                </tr>
            </thead>
            <tbody>`;
    const start = (paginaActual - 1) * itemsPorPagina;
    alertasData.slice(start, start + itemsPorPagina).forEach(a => {
        html += `
            <tr>
                <td>${new Date(a.fecha).toLocaleString()}</td>
                <td>${a.nombreEstacion}</td>
                <td>${a.sensorNombre}</td>
                <td>${a.tipoSensor}</td>
                <td>${a.valor}</td>
                <td>${a.mensaje}</td>
            </tr>`;
    });
    html += `</tbody></table>`;
    alertasDiv.innerHTML = html;
    const pagHtml = `
        <button class="prev-page" ${paginaActual === 1 ? 'disabled' : ''}>Anterior</button>
        <span>${paginaActual} / ${totalPaginas}</span>
        <button class="next-page" ${paginaActual === totalPaginas ? 'disabled' : ''}>Siguiente</button>`;
    pagDiv.innerHTML = pagHtml;
    pagDiv.querySelector('.prev-page').onclick = () => {
        if (paginaActual > 1) {
            paginaActual--;
            renderAlertasTabla();
        }
    };
    pagDiv.querySelector('.next-page').onclick = () => {
        if (paginaActual < totalPaginas) {
            paginaActual++;
            renderAlertasTabla();
        }
    };
}

function renderAlertas(alertas) {
    alertasData = alertas;
    paginaActual = 1;
    renderAlertasTabla();
}

function cargarDashboard() {
    fetch("/api/stations/summary")
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById("resumen-general");
            const html = `
                <div class="info-card"><span>Total Estaciones</span><span>${data.total}</span></div>
                <div class="info-card success"><span>En Línea</span><span>${data.enLinea}</span></div>
                <div class="info-card warning"><span>Desconectadas</span><span>${data.desconectadas}</span></div>
                <div class="info-card danger"><span>Alarmas Activas</span><span>${data.alertasActivas}</span></div>`;
            container.innerHTML = html;
        })
        .catch(() => {
            document.getElementById("resumen-general").innerHTML = "<p>Error cargando datos</p>";
        });

    fetch("/api/stations/status-summary")
        .then(res => res.json())
        .then(renderEstaciones)
        .catch(() => {
            document.getElementById("summary").innerHTML = "<p>Error cargando estaciones.</p>";
        });

    fetch("/api/alertas")
        .then(res => res.json())
        .then(renderAlertas)
        .catch(() => {
            document.getElementById("alertas-container").innerHTML = "<p>Error cargando alertas.</p>";
            document.getElementById("alertas-pagination").innerHTML = "";

        });
}

let stompClient = null;
function cargarEstacionesForm() {
    fetch('/api/stations')
        .then(res => res.json())
        .then(estaciones => {
            const sel = document.getElementById('alert-station-select');
            sel.innerHTML = '<option value="">Estaci\u00f3n...</option>';
            estaciones.forEach(e => {
                const opt = document.createElement('option');
                opt.value = e.stationId;
                opt.textContent = e.stationModel;
                sel.appendChild(opt);
            });
        });
}

document.getElementById('alert-station-select').addEventListener('change', e => {
    const id = e.target.value;
    const sensorSel = document.getElementById('alert-sensor-select');
    if (!id) {
        sensorSel.disabled = true;
        sensorSel.innerHTML = '<option value="">Sensor...</option>';
        return;
    }
    fetch(`/api/stations/${id}/sensors`)
        .then(res => res.json())
        .then(sensores => {
            sensorSel.innerHTML = '<option value="">Sensor...</option>';
            sensores.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.sensorId;
                opt.textContent = s.sensorModel;
                sensorSel.appendChild(opt);
            });
            sensorSel.disabled = false;
        });
});

document.getElementById('alert-form').addEventListener('submit', e => {
    e.preventDefault();
    const stationId = document.getElementById('alert-station-select').value;
    const sensorId = document.getElementById('alert-sensor-select').value;
    const valor = document.getElementById('alert-valor').value;
    const mensaje = document.getElementById('alert-mensaje').value;
    fetch('/api/alertas/manual', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: `stationId=${stationId}&sensorId=${sensorId}&umbral=${valor}&mensaje=${encodeURIComponent(mensaje)}`
    }).then(() => {
        document.getElementById('alert-mensaje').value = '';
        document.getElementById('alert-valor').value = '';
    });
});

function connectWs() {
    const socket = new SockJS('/ws');
    stompClient = Stomp.over(socket);

    // Añadimos heart-beating para mantener la conexión activa en segundo plano.
    // El cliente enviará un "ping" cada 10 segundos para evitar que la conexión
    // sea cerrada por inactividad por proxies o por el propio navegador.
    stompClient.heartbeat.outgoing = 10000;
    stompClient.heartbeat.incoming = 0; // No esperamos heartbeats del servidor

    stompClient.connect({}, () => {
        stompClient.subscribe('/topic/status', msg => {
            const estaciones = JSON.parse(msg.body);
            renderEstaciones(estaciones);
        });
        stompClient.subscribe('/topic/alertas', msg => {
            const alertas = JSON.parse(msg.body);
            renderAlertas(alertas);
        });
    });
}

// Usamos la API de Visibilidad de Página para recargar los datos cuando la pestaña vuelve a estar activa.
// Esto asegura que el usuario siempre vea los datos más frescos al regresar a la página.
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
        console.log('La pestaña es visible de nuevo. Actualizando datos...');
        cargarDashboard();
    }
});

window.onload = () => {
    cargarDashboard();
    connectWs();
    cargarEstacionesForm();
}

</script>
</body>
</html>
