<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | WeatherNet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
<div class="sidebar">
    <h2>WeatherNet</h2>
    <ul>
        <li><a href="/dashboard" class="active">Dashboard</a></li>

        <li sec:authorize="hasRole('ADMIN')">
            <a href="/dashboard/administrar-estaciones">Estaciones</a>
        </li>

        <li sec:authorize="hasAnyRole('ADMIN', 'USER')">
            <a href="/dashboard/reportes">Reportes</a>
        </li>

        <li sec:authorize="hasAnyRole('ADMIN', 'USER')">
            <a href="/dashboard/graficos">Gráficos</a>
        </li>
    </ul>

    <hr style="border: none; border-top: 1px solid #334155; margin: 20px 0;">

    <ul>
        <li><a href="/dashboard/alertas">Alertas</a></li>
    </ul>

    <hr style="border: none; border-top: 1px solid #334155; margin: 20px 0;">

    <ul>
        <li>
            <form th:action="@{/logout}" method="post">
                <button type="submit" style="background: none; border: none; color: #f87171; font-weight: bold; cursor: pointer;">⏻ Cerrar sesión</button>
            </form>
        </li>
    </ul>
</div>

<div class="main-content">
    <h1>Dashboard</h1>
    <div id="alert-banner"></div>

    <!-- 🧾 Resumen de estado general -->
    <div id="resumen-general" class="indicator-container"></div>

    <!-- 🌐 Estaciones por tarjeta -->
    <h2 style="margin-top: 2rem;">Estaciones Meteorológicas</h2>
    <div id="summary" class="cards-container"></div>

    <!-- 🔘 Botón de actualización -->
    <div style="margin: 1rem 0;">
        <button onclick="cargarDashboard()" style="padding: 8px 16px; font-weight: bold;">
            🔄 Actualizar Datos
        </button>
    </div>
</div>

<!-- 🔄 Script para cargar datos -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
let estacionesData = {};
let alertCount = 0;
let stompClient;

function gradosADireccion(grados) {
    if (grados === undefined || grados === null || isNaN(grados)) return 'N/D';
    const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
    const idx = Math.round(((grados % 360) / 45)) % 8;
    return dirs[idx];
}

function mostrarBanner(nombre) {
    const cont = document.getElementById('alert-banner');
    cont.innerHTML = `
    <div class="alert alert-warning alert-dismissible fade show" role="alert">
      ⚠️ La estación <strong>${nombre}</strong> se ha desconectado.
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>`;
}

function mostrarAlertaBanner(alerta) {
    const cont = document.getElementById('alert-banner');
    const tipo = alerta.mensaje.includes('alto') ? 'danger' : 'warning';
    const icono = tipo === 'danger' ? '🚨' : '⚠️';
    const div = document.createElement('div');
    div.className = `alert alert-${tipo} alert-dismissible fade show`;
    div.role = 'alert';
    div.innerHTML = `
        ${icono} ¡Alerta activa! Umbral superado para <strong>${alerta.sensorNombre}</strong>
        en <strong>${alerta.nombreEstacion}</strong> — Valor: <strong>${alerta.valor}</strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    `;
    cont.appendChild(div);
}

function ocultarBanner() {
    document.getElementById('alert-banner').innerHTML = '';
}

function cargarDashboard() {
    // Cargar resumen general
    fetch("/api/stations/summary")
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById("resumen-general");
            const html = `
                <div class="indicator-card indicator-total">
                    <h3>🛰️ Total Estaciones</h3>
                    <div class="number">${data.total}</div>
                </div>
                <div class="indicator-card indicator-online">
                    <h3>✅ En Línea</h3>
                    <div class="number">${data.enLinea}</div>
                </div>
                <div class="indicator-card indicator-offline">
                    <h3>🔌 Desconectadas</h3>
                    <div class="number">${data.desconectadas}</div>
                </div>
                <div class="indicator-card indicator-alerts">
                    <h3>⚠️ Alarmas Activas</h3>
                    <div class="number">${data.alertasActivas}</div>
                </div>
            `;
            container.innerHTML = html;
            alertCount = data.alertasActivas;
        })
        .catch(error => {
            document.getElementById("resumen-general").innerHTML = "<p>Error cargando datos</p>";
            console.error(error);
        });

    // Cargar estaciones
    fetch("/api/stations/status-summary")
        .then(res => res.json())
        .then(estaciones => {
            const container = document.getElementById("summary");
            container.innerHTML = "";
            estacionesData = {};

            estaciones.forEach(est => {
                const card = document.createElement("div");
                card.classList.add("station-card");
                card.id = `station-${est.stationName}`;
                if (est.status === "DESCONECTADA") {
                    card.classList.add("offline");
                }

                const ultimaLectura = est.lastUpdate
                    ? new Date(est.lastUpdate).toLocaleString()
                    : "No disponible";

                card.innerHTML = `
                    <h3>${est.stationName}</h3>
                    <p><strong>Estado:</strong> ${est.status}</p>
                    <p><strong>Última lectura:</strong><br> ${ultimaLectura}</p>
                    <ul>
                        <li>🌡️ Temperatura: ${est.data?.temperatura ?? 'N/D'} °C</li>
                        <li>💧 Humedad: ${est.data?.humedad ?? 'N/D'} %</li>
                        <li>⬇️ Presión: ${est.data?.presion ?? 'N/D'} hPa</li>
                        <li>💨 Viento: ${est.data?.viento ?? 'N/D'} m/s</li>
                        <li>🌬️ Dirección Viento: ${est.data?.direccion_viento !== undefined ? gradosADireccion(est.data.direccion_viento) : 'N/D'}</li>
                        <li>🌧️ Precipitación: ${est.data?.precipitacion ?? 'N/D'} mm</li>
                        <li>🌱 Humedad Suelo: ${est.data?.humedad_suelo ?? 'N/D'} %</li>
                    </ul>
                `;
                container.appendChild(card);
                estacionesData[est.stationName] = est;
            });
            actualizarResumenGeneral();
        })
        .catch(err => {
            document.getElementById("summary").innerHTML = "<p>Error cargando estaciones.</p>";
            console.error(err);
        });
}

function actualizarResumenGeneral() {
    const total = Object.keys(estacionesData).length;
    let enLinea = 0;
    Object.values(estacionesData).forEach(e => { if (e.status === 'EN_LINEA') enLinea++; });
    const desconectadas = total - enLinea;
    const container = document.getElementById("resumen-general");
    container.innerHTML = `
        <div class="indicator-card indicator-total">
            <h3>🛰️ Total Estaciones</h3>
            <div class="number">${total}</div>
        </div>
        <div class="indicator-card indicator-online">
            <h3>✅ En Línea</h3>
            <div class="number">${enLinea}</div>
        </div>
        <div class="indicator-card indicator-offline">
            <h3>🔌 Desconectadas</h3>
            <div class="number">${desconectadas}</div>
        </div>
        <div class="indicator-card indicator-alerts">
            <h3>⚠️ Alarmas Activas</h3>
            <div class="number">${alertCount}</div>
        </div>`;
}

function actualizarUIEstacion(dto) {
    estacionesData[dto.stationName] = dto;
    if(dto.status === 'EN_LINEA') ocultarBanner();
    let card = document.getElementById(`station-${dto.stationName}`);
    if (!card) {
        card = document.createElement('div');
        card.classList.add('station-card');
        card.id = `station-${dto.stationName}`;
        document.getElementById('summary').appendChild(card);
    }
    card.classList.toggle('offline', dto.status === 'DESCONECTADA');
    const ultimaLectura = dto.lastUpdate ? new Date(dto.lastUpdate).toLocaleString() : 'No disponible';
    card.innerHTML = `
        <h3>${dto.stationName}</h3>
        <p><strong>Estado:</strong> ${dto.status}</p>
        <p><strong>Última lectura:</strong><br> ${ultimaLectura}</p>
        <ul>
            <li>🌡️ Temperatura: ${dto.data?.temperatura ?? 'N/D'} °C</li>
            <li>💧 Humedad: ${dto.data?.humedad ?? 'N/D'} %</li>
            <li>⬇️ Presión: ${dto.data?.presion ?? 'N/D'} hPa</li>
            <li>💨 Viento: ${dto.data?.viento ?? 'N/D'} m/s</li>
            <li>🌬️ Dirección Viento: ${dto.data?.direccion_viento !== undefined ? gradosADireccion(dto.data.direccion_viento) : 'N/D'}</li>
            <li>🌧️ Precipitación: ${dto.data?.precipitacion ?? 'N/D'} mm</li>
            <li>🌱 Humedad Suelo: ${dto.data?.humedad_suelo ?? 'N/D'} %</li>
        </ul>`;
    actualizarResumenGeneral();
}

function conectarWS() {
    const socket = new SockJS('/ws');
    stompClient = Stomp.over(socket);
    stompClient.connect({}, () => {
        stompClient.subscribe('/topic/estaciones', msg => {
            const data = JSON.parse(msg.body);
            actualizarUIEstacion(data);
        });
        stompClient.subscribe('/topic/alertas', msg => {
            const a = JSON.parse(msg.body);
            alertCount++;
            actualizarResumenGeneral();
            if(a.mensaje === 'Estación desconectada por inactividad') {
                mostrarBanner(a.nombreEstacion);
            } else if(a.mensaje && a.mensaje.includes('Umbral')) {
                mostrarAlertaBanner(a);
            }
        });
    });
}

// 🔃 Ejecutar al cargar la página
window.onload = () => { cargarDashboard(); conectarWS(); };
</script>

</body>
</html>
